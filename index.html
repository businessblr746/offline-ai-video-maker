
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aman & Kiyara AI Video Maker</title>
<style>
body{font-family:Arial;background:#101323;color:white;padding:18px;margin:0}
.container{max-width:520px;margin:auto;background:#202943;padding:20px;border-radius:16px}
h2{text-align:center}
label{display:block;margin-top:15px}
input,select,textarea,button{width:100%;padding:13px;margin-top:8px;box-sizing:border-box;border-radius:9px;font-size:16px}
textarea{height:110px}
button{background:#7657ed;color:white;border:0;font-weight:bold;cursor:pointer}
#status{overflow-wrap:anywhere;line-height:1.5}
img,video{width:100%;margin-top:15px;border-radius:10px}
a{color:#b9a8ff}
</style>
</head>
<body>
<div class="container">
<h2>🎬 Aman & Kiyara AI Video Maker</h2>

<label>Upload Your Photo</label>
<input type="file" id="photo" accept="image/jpeg,image/png,image/webp">
<img id="preview" hidden>

<label>Select Character Voice</label>
<select id="voice">
<option value="Puck (Male)">Aman - Male</option>
<option value="Zephyr (Female)">Kiyara - Female</option>
</select>

<label>Enter Hindi Dialogue</label>
<textarea id="script" placeholder="Enter your Hindi dialogue here...">नमस्ते! आप कैसे हैं?</textarea>

<label>Video Quality</label>
<select id="resolution">
<option value="720p">720p HD</option>
<option value="1080p">1080p Full HD</option>
</select>

<button id="generate" onclick="generateVideo()">Generate Talking Video</button>

<p id="status">Upload a portrait photo to get started.</p>

<video id="result" controls playsinline hidden></video>
<a id="download" hidden download="talking-video.mp4">Download Video</a>
</div>

<script>
const API_URL =
"https://summer-boat-451bai-video-backend.businessblr746.workers.dev/";

const photoInput = document.getElementById("photo");
const preview = document.getElementById("preview");
const statusText = document.getElementById("status");

photoInput.addEventListener("change", () => {
  const file = photoInput.files[0];
  if (!file) return;
  preview.src = URL.createObjectURL(file);
  preview.hidden = false;
});

async function generateVideo() {
  const photo = photoInput.files[0];
  const script = document.getElementById("script").value.trim();
  const voice = document.getElementById("voice").value;
  const resolution = document.getElementById("resolution").value;
  const button = document.getElementById("generate");

  if (!photo) {
    statusText.textContent = "Please upload a photo first.";
    return;
  }

  if (!script) {
    statusText.textContent = "Please enter your Hindi dialogue.";
    return;
  }

  button.disabled = true;
  button.textContent = "Generating...";
  statusText.textContent = "Sending your photo to AI. Please wait...";
  document.getElementById("result").hidden = true;
  document.getElementById("download").hidden = true;

  try {
    const form = new FormData();
    form.append("photo", photo);
    form.append("script", script);
    form.append("voice", voice);
    form.append("resolution", resolution);

    const response = await fetch(API_URL, {
      method: "POST",
      body: form
    });

    const data = await response.json();

    if (!response.ok || !data.success) {
      throw new Error(data.error || "Video generation failed.");
    }

    const videoUrl = data.data?.result?.video;

    if (!videoUrl) {
      throw new Error("AI did not return a video URL.");
    }

    const video = document.getElementById("result");
    video.src = videoUrl;
    video.hidden = false;

    const download = document.getElementById("download");
    download.href = videoUrl;
    download.hidden = false;

    statusText.textContent = "Your talking video is ready!";

  } catch (error) {
    statusText.textContent = "Error: " + error.message;
  } finally {
    button.disabled = false;
    button.textContent = "Generate Talking Video";
  }
}
</script>
</body>
</html>
