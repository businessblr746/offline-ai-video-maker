
<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aman and Kiyara Voice Test</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f2f2f2;
  padding: 20px;
}
.container {
  background: white;
  padding: 20px;
  border-radius: 14px;
}
select, button, textarea {
  width: 100%;
  padding: 13px;
  margin: 10px 0;
  font-size: 16px;
  box-sizing: border-box;
}
button {
  background: #1769e0;
  color: white;
  border: 0;
  border-radius: 8px;
}
#status {
  overflow-wrap: anywhere;
}
</style>
</head>
<body>
<div class="container">
<h2>Aman and Kiyara Hindi Voice Test</h2>

<label>Select Character:</label>
<select id="character">
  <option value="aman">Aman - Male</option>
  <option value="kiyara">Kiyara - Female</option>
</select>

<textarea id="dialogue" rows="4">Namaste! Aap kaise hain?</textarea>

<button onclick="testVoice()">Play Voice</button>
<button onclick="checkVoices()">Refresh Voice List</button>

<p id="status">Checking iPhone voices...</p>
</div>

<script>
let availableVoices = [];

function checkVoices() {
  availableVoices = speechSynthesis.getVoices();

  const hindiVoices = availableVoices.filter(v =>
    v.lang.toLowerCase().startsWith("hi")
  );

  const names = hindiVoices.map(v =>
    v.name + " (" + v.lang + ")"
  );

  document.getElementById("status").textContent =
    "Hindi voices Safari can access: " +
    (names.length ? names.join(" | ") : "None found");
}

function testVoice() {
  const character =
    document.getElementById("character").value;

  const target = character === "aman" ? "neel" : "lekha";

  const voice = availableVoices.find(v =>
    v.lang.toLowerCase().startsWith("hi") &&
    v.name.toLowerCase().includes(target)
  );

  if (!voice) {
    document.getElementById("status").textContent =
      target.toUpperCase() +
      " voice is not accessible to Safari. Refresh or check voice availability.";
    return;
  }

  speechSynthesis.cancel();

  const message = new SpeechSynthesisUtterance(
    document.getElementById("dialogue").value
  );

  message.voice = voice;
  message.lang = voice.lang;

  document.getElementById("status").textContent =
    "Playing " + character + ": " + voice.name;

  speechSynthesis.speak(message);
}

speechSynthesis.onvoiceschanged = checkVoices;
setTimeout(checkVoices, 1500);
</script>
</body>
</html>
