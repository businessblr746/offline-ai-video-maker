
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101018">
<title>Offline AI Video Maker</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:18px;background:#101018;color:white;font-family:Arial}
h1{text-align:center;color:#91a0ff}
p{color:#bbb}
.panel{background:#202031;padding:15px;border-radius:15px;margin:14px 0}
label{display:block;margin:14px 0 7px}
input,select,textarea,button{width:100%;padding:13px;border-radius:10px;border:0;font-size:15px}
input,select,textarea{background:#303044;color:white}
button{background:#6578ff;color:white;font-weight:bold;margin-top:12px}
canvas{width:100%;border-radius:12px;background:#252535}
.small{font-size:12px;color:#aaa}
</style>
</head>
<body>
<h1>Offline AI Video Maker</h1>
<p style="text-align:center">Photo Animation Studio</p>

<div class="panel">
<label>Select your photo</label>
<input type="file" id="photo" accept="image/*">
</div>

<div class="panel">
<label>Camera movement</label>
<select id="camera">
<option value="zoom">Zoom In</option>
<option value="out">Zoom Out</option>
<option value="left">Move Left</option>
<option value="right">Move Right</option>
<option value="both">Zoom + Camera Movement</option>
<option value="none">No Movement</option>
</select>

<label>Animation effect</label>
<select id="effect">
<option value="none">Normal</option>
<option value="face">Face-style Pulse (simulated)</option>
<option value="walk">Walking-style Motion (simulated)</option>
</select>

<label>Video duration</label>
<select id="duration">
<option value="5">5 Seconds</option>
<option value="10">10 Seconds</option>
<option value="15">15 Seconds</option>
<option value="20">20 Seconds</option>
</select>

<label>Video quality</label>
<select id="quality">
<option value="480">480p</option>
<option value="720" selected>720p</option>
<option value="1080">1080p</option>
</select>
</div>

<div class="panel">
<label>Hindi dialogue</label>
<textarea id="dialogue" rows="3" placeholder="Yahan Hindi dialogue likhein..."></textarea>
<button id="speak">Preview Hindi Voice</button>
<p class="small">Voice availability depends on the Hindi voice installed on your iPhone. Preview audio is not included in the exported video.</p>
</div>

<div class="panel">
<canvas id="screen" width="720" height="1280"></canvas>
<button id="preview">Preview Animation</button>
<button id="record">Create Video</button>
<p id="status">Please select a photo.</p>
<video id="result" controls playsinline style="width:100%"></video>
<a id="save" style="display:block;color:#aab7ff;margin-top:15px"></a>
</div>

<script>
const $ = id => document.getElementById(id);
const canvas = $("screen");
const ctx = canvas.getContext("2d");
let img = new Image();
let ready = false;
let running = false;
let startTime = 0;
let previewFrame;

$("photo").onchange = () => {
 const file = $("photo").files[0];
 if (!file) return;
 const url = URL.createObjectURL(file);
 img.onload = () => {
  ready = true;
  draw(0);
  $("status").textContent = "Photo ready!";
 };
 img.src = url;
};

function draw(seconds) {
 if (!ready) return;
 const duration = Number($("duration").value);
 const t = Math.min(seconds / duration, 1);
 const camera = $("camera").value;
 const effect = $("effect").value;

 let zoom = 1;
 let shiftX = 0;
 let shiftY = 0;

 if(camera==="zoom") zoom=1+0.22*t;
 if(camera==="out") zoom=1.22-0.22*t;
 if(camera==="left") shiftX=-100*t;
 if(camera==="right") shiftX=100*t;
 if(camera==="both") {
  zoom=1+0.16*t;
  shiftX=-70*t;
 }

 if(effect==="face") {
  zoom *= 1 + Math.sin(seconds*3)*0.012;
 }
 if(effect==="walk") {
  shiftX += Math.sin(seconds*8)*12;
  shiftY += Math.abs(Math.sin(seconds*8))*7;
 }

 const scale=Math.max(canvas.width/img.width,canvas.height/img.height)*zoom;
 const w=img.width*scale;
 const h=img.height*scale;
 const x=(canvas.width-w)/2+shiftX;
 const y=(canvas.height-h)/2+shiftY;

 ctx.clearRect(0,0,canvas.width,canvas.height);
 ctx.drawImage(img,x,y,w,h);
}

function previewLoop(now) {
 if(!running) return;
 const seconds=(now-startTime)/1000;
 draw(seconds);
 previewFrame=requestAnimationFrame(previewLoop);
}

$("preview").onclick=()=>{
 if(!ready) return alert("Please select a photo.");
 cancelAnimationFrame(previewFrame);
 running=true;
 startTime=performance.now();
 previewFrame=requestAnimationFrame(previewLoop);
};

$("speak").onclick=()=>{
 const text=$("dialogue").value.trim();
 if(!text) return alert("Please write a Hindi dialogue.");
 if(!("speechSynthesis" in window))
  return alert("Speech preview is not supported in this browser.");
 speechSynthesis.cancel();
 const utterance=new SpeechSynthesisUtterance(text);
 utterance.lang="hi-IN";
 speechSynthesis.speak(utterance);
};

$("record").onclick=()=>{
 if(!ready) return alert("Please select a photo.");
 if(!canvas.captureStream || !window.MediaRecorder)
  return alert("Video recording is not supported in this browser.");

 running=false;
 cancelAnimationFrame(previewFrame);
 const height=Number($("quality").value);
 canvas.width=Math.round(height*9/16);
 canvas.height=height;

 const stream=canvas.captureStream(30);
 let mime="";
 for(const type of ["video/mp4;codecs=h264","video/mp4","video/webm"]) {
  if(MediaRecorder.isTypeSupported(type)){mime=type;break;}
 }
 if(!mime) return alert("Recording format not supported.");

 let recorder;
 try {
  recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:
   height>=1080?5000000:height>=720?2500000:1000000});
 } catch(e) {
  return alert("Could not start video recording.");
 }

 const chunks=[];
 recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
 recorder.onerror=()=>{$("status").textContent="Recording error.";};
 recorder.onstop=()=>{
  const blob=new Blob(chunks,{type:mime});
  const url=URL.createObjectURL(blob);
  $("result").src=url;
  $("save").href=url;
  $("save").download=mime.includes("mp4")?"my-video.mp4":"my-video.webm";
  $("save").textContent="Download Your Video";
  $("status").textContent="Video created successfully!";
  stream.getTracks().forEach(track=>track.stop());
 };

 $("status").textContent="Creating video...";
 recorder.start();
 const duration=Number($("duration").value);
 const start=performance.now();

 function frame(now) {
  const seconds=(now-start)/1000;
  draw(seconds);
  if(seconds<duration) requestAnimationFrame(frame);
  else recorder.stop();
 }
 requestAnimationFrame(frame);
};
</script>
</body>
</html>
