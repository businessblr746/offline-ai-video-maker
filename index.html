
<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hindi Voice Test</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f2f2f2;
  padding: 20px;
}
.container {
  background: white;
  padding: 20px;
  border-radius: 14px;
}
select, button, textarea {
  width: 100%;
  padding: 13px;
  margin: 10px 0;
  font-size: 16px;
}
button {
  background: #1769e0;
  color: white;
  border: 0;
  border-radius: 8px;
}
</style>
</head>
<body>
<div class="container">
<h2>Hindi Voice Test</h2>

<label>Select Hindi Voice:</label>
<select id="voiceSelect"></select>

<textarea id="dialogue" rows="4">Namaste! Aap kaise hain?</textarea>

<button onclick="speak()">Test Selected Voice</button>
<button onclick="loadVoices()">Refresh Voice List</button>

<p id="status">Loading voices...</p>
</div>

<script>
let voices = [];

function loadVoices() {
  voices = speechSynthesis.getVoices();

  const hindi = voices.filter(v =>
    v.lang.toLowerCase().startsWith("hi")
  );

  const select = document.getElementById("voiceSelect");
  select.innerHTML = "";

  hindi.forEach((voice, i) => {
    const option = document.createElement("option");
    option.value = i;
    option.textContent = voice.name + " (" + voice.lang + ")";
    select.appendChild(option);
  });

  document.getElementById("status").textContent =
    hindi.length
    ? hindi.length + " Hindi voice(s) found."
    : "No Hindi voices accessible in Safari.";

  window.hindiVoices = hindi;
}

function speak() {
  const hindi = window.hindiVoices || [];
  const index = document.getElementById("voiceSelect").value;
  const voice = hindi[index];

  if (!voice) {
    alert("No Hindi voice selected.");
    return;
  }

  speechSynthesis.cancel();

  const msg = new SpeechSynthesisUtterance(
    document.getElementById("dialogue").value
  );

  msg.voice = voice;
  msg.lang = voice.lang;
  speechSynthesis.speak(msg);
}

speechSynthesis.onvoiceschanged = loadVoices;
setTimeout(loadVoices, 1500);
</script>
</body>
</html>
